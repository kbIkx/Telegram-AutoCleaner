[project]
name = "telegram-autocleaner"
version = "1.1.0"
description = "Безопасная автоматическая очистка Telegram-групп"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"run.py" = ["UP036"]  # Friendly error for an accidentally selected old interpreter.
"tests/conftest.py" = ["ASYNC109"]  # Signatures must match aiogram's BaseSession.
